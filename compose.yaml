services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      HUBSPOT_PIPELINE: ${HUBSPOT_PIPELINE:-default}
      HUBSPOT_DEAL_STAGE: ${HUBSPOT_DEAL_STAGE:-closedwon}
      DATABASE_PATH: /app/data/sync.sqlite
    volumes:
      - sync_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/sync-attempts').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  export:
    image: python:3.12-slim
    profiles: [tools]
    working_dir: /work
    environment:
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
    volumes:
      - ./scripts:/work/scripts:ro
      - ./data:/output
    command: ["python", "scripts/export_deals.py", "--output", "/output/deals-last-7-days.csv"]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2
    profiles: [automation]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      HUBSPOT_PIPELINE: ${HUBSPOT_PIPELINE:-default}
      HUBSPOT_DEAL_STAGE: ${HUBSPOT_DEAL_STAGE:-closedwon}
      N8N_FAILURE_WEBHOOK_URL: ${N8N_FAILURE_WEBHOOK_URL:-}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Manila
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  sync_data:
  n8n_data:
